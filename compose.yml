# Console on the Docker host. Bind the *published* port to localhost only.
# Inside the container Vinext must listen on 0.0.0.0 so the port map works.
# Do not change the host mapping to 0.0.0.0:3000:3000 on a public VM.
# Reach the console from another machine via Tailscale Serve, an SSH tunnel,
# or Cloudflare Tunnel to http://127.0.0.1:3000 — see docs/install.md.

services:
  gantree:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gantree.toml:/app/gantree.toml
      - ./gantries:/app/gantries
      - ./backups:/app/backups
    restart: unless-stopped
