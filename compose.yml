# Console on the Docker host. Vinext listens on :3000 *inside* the container.
# This file is LAN :80. Public hostname — pick one, do not mix:
#   compose.cloudflare.yml  recommended (Tunnel, no WAN ports)
#   compose.nginx.yml       origin TLS (grey-cloud DNS, router 80+443)
#
# Run compose from this checkout so PWD is the yard (or set GANTREE_HOST_ROOT).
# Recreate bind-mounts are host paths; without GANTREE_HOST_ROOT they become
# /app/gantries/… on the host and the crane loses mcp.toml + data/.config.
#
# Crane uid is inferred (data/ owner, then this compose user). Compose reads
# UID from your shell (or SUDO_UID if you sudo). Override only if needed:
#   GANTREE_CRANE_USER=1000:1000 docker compose up -d
#   docker compose up -d --build
# First boot is /setup (one operator). Yard sqlite is ./var/gantree.db — not a
# crane's data/gantry.db. Forgot passphrase: stop, delete var/gantree.db, setup.
# Never set GANTREE_DEV here — HOST=0.0.0.0, so auto-login is ignored anyway.

services:
  gantree:
    image: shotah/gantree:${GANTREE_TAG:-latest}
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DOCKER_SOCKET: /var/run/docker.sock
      GANTREE_CRANE_USER: ${GANTREE_CRANE_USER:-${SUDO_UID:-${UID:-1000}}:${SUDO_GID:-${GID:-1000}}}
      GANTREE_ROOT: /app
      GANTREE_HOST_ROOT: ${GANTREE_HOST_ROOT:-${PWD}}
      GANTREE_DB: /app/var/gantree.db
    ports:
      # host:container — LAN http://<mini>/ hits Vinext :3000 inside the box.
      - "${GANTREE_LISTEN:-0.0.0.0}:80:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gantree.toml:/app/gantree.toml
      - ./gantries:/app/gantries
      - ./backups:/app/backups
      - ./var:/app/var
      # Same-path attach: gantree.toml absolute paths must exist in this
      # container, and recreate bind-mounts them from the host. Uncomment
      # and match your inventory.
      # - /opt/agents:/opt/agents
    restart: unless-stopped
