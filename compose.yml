# Console on the Docker host. Home LAN: publish :3000 on all interfaces.
# Cloud VM: GANTREE_LISTEN=127.0.0.1 — do not open a WAN firewall port.
# Inside the container Vinext must listen on 0.0.0.0 so the port map works.
#
# Cranes must run as the host user that owns data/ (not Distroless 65532).
# Console-in-Docker is often root, so pass the host uid:
#   GANTREE_CRANE_USER="$(id -u):$(id -g)" docker compose pull && docker compose up -d
#   GANTREE_CRANE_USER="$(id -u):$(id -g)" docker compose up -d --build
# Attach existing agents by mounting their host paths at the same path
# (gantree.toml uses those paths for recreate). Example:
#   - /opt/agents:/opt/agents

services:
  gantree:
    image: shotah/gantree:${GANTREE_TAG:-latest}
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 80
      DOCKER_SOCKET: /var/run/docker.sock
      GANTREE_CRANE_USER: ${GANTREE_CRANE_USER:-}
    ports:
      - "${GANTREE_LISTEN:-0.0.0.0}:3000:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gantree.toml:/app/gantree.toml
      - ./gantries:/app/gantries
      - ./backups:/app/backups
    restart: unless-stopped
