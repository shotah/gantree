<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="The household. Gantree writes files to the crane and never sits in the turn. Pendant, cab, and helm dial the mailbox. The crane dials out.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1316"/>
      <stop offset="55%" stop-color="#171d22"/>
      <stop offset="100%" stop-color="#232b32"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcd6ce"/>
      <stop offset="40%" stop-color="#9aa3ab"/>
      <stop offset="100%" stop-color="#5c6772"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4550"/>
      <stop offset="50%" stop-color="#9aa3ab"/>
      <stop offset="100%" stop-color="#3a4550"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232b32"/>
      <stop offset="100%" stop-color="#171d22"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232b32"/>
      <stop offset="100%" stop-color="#171d22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3b199"/>
      <stop offset="42%" stop-color="#f07848"/>
      <stop offset="100%" stop-color="#a84828"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#f07848" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f07848" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f07848" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <symbol id="mini-gantry" viewBox="0 0 160 88">
      <rect x="8" y="78" width="144" height="10" rx="2" fill="url(#bed)" stroke="#3a4550" stroke-width="1"/>
      <rect x="18" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="135" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="12" y="10" width="136" height="12" rx="2" fill="url(#beam)"/>
      <rect x="18" y="13" width="124" height="3" rx="1" fill="#f4f0ea" opacity="0.5"/>
      <rect x="66" y="8" width="28" height="16" rx="2" fill="#dcd6ce"/>
      <rect x="74" y="24" width="12" height="14" rx="1" fill="#9aa3ab"/>
      <rect x="64" y="40" width="32" height="18" rx="3" fill="url(#chip)" stroke="#f07848" stroke-width="1.2"/>
      <text x="80" y="53" text-anchor="middle" fill="#f3b199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.6">MODEL</text>
    </symbol>
    <marker id="arr-accent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#f07848"/>
    </marker>
    <marker id="arr-ok" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#3db8a0"/>
    </marker>
  </defs>

  <rect width="1280" height="460" fill="url(#sky)"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <ellipse cx="760" cy="250" rx="300" ry="140" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="32" fill="#f07848" font-size="16" font-weight="700" letter-spacing="6">THE HOUSEHOLD</text>
    <text x="640" y="52" fill="#9aa3ab" font-size="12" letter-spacing="3">ONE CRANE &#183; MOUTHS DIAL IN</text>
  </g>

  <!-- Yard: above the crane, off the chat path -->
  <g transform="translate(470,66)" filter="url(#soft)">
    <rect x="0" y="0" width="430" height="48" rx="5" fill="#171d22" stroke="#f07848" stroke-width="1.5"/>
    <rect x="12" y="8" width="64" height="32" rx="3" fill="#0e1316"/>
    <g fill="#3db8a0">
      <circle cx="26" cy="24" r="3"/>
      <circle cx="40" cy="24" r="3" opacity="0.5"/>
      <circle cx="54" cy="24" r="3" opacity="0.35"/>
    </g>
    <text x="92" y="22" fill="#f3b199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">GANTREE</text>
    <text x="92" y="38" fill="#9aa3ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.6">shipping yard &#183; never in the turn</text>
  </g>
  <path d="M760 114 C790 132 800 148 792 168" fill="none" stroke="#f07848" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85" marker-end="url(#arr-accent)"/>
  <text x="628" y="132" fill="#84909a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">files + docker</text>

  <!-- Mouths we own. Pendant is a browser, anywhere. -->
  <g transform="translate(22,196)" filter="url(#soft)">
    <rect x="0" y="0" width="108" height="74" rx="6" fill="url(#accent)"/>
    <circle cx="12" cy="9" r="2.2" fill="#0e1316"/>
    <circle cx="20" cy="9" r="2.2" fill="#0e1316" opacity="0.55"/>
    <circle cx="28" cy="9" r="2.2" fill="#0e1316" opacity="0.35"/>
    <rect x="5" y="18" width="98" height="51" rx="2" fill="#0e1316"/>
    <rect x="12" y="26" width="34" height="6" rx="2" fill="#232b32"/>
    <rect x="56" y="36" width="38" height="6" rx="2" fill="#f07848" opacity="0.9"/>
    <rect x="12" y="48" width="28" height="6" rx="2" fill="#3a4550"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="76" y="312" fill="#f4f0ea" font-size="12" font-weight="700" letter-spacing="1.4">PENDANT</text>
    <text x="76" y="328" fill="#9aa3ab" font-size="9" letter-spacing="0.8">web app</text>
  </g>

  <g transform="translate(148,176)" filter="url(#soft)">
    <rect x="0" y="0" width="64" height="112" rx="10" fill="url(#accent)"/>
    <rect x="5" y="8" width="54" height="88" rx="4" fill="#0e1316"/>
    <text x="32" y="56" text-anchor="middle" fill="#f3b199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">KIT</text>
    <circle cx="32" cy="102" r="3.5" fill="#0e1316"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="180" y="312" fill="#f4f0ea" font-size="12" font-weight="700" letter-spacing="1.4">CAB</text>
    <text x="180" y="328" fill="#9aa3ab" font-size="9" letter-spacing="0.6">Android + Auto</text>
  </g>

  <g transform="translate(252,176)" filter="url(#soft)">
    <rect x="0" y="0" width="64" height="112" rx="14" fill="url(#accent)"/>
    <rect x="5" y="6" width="54" height="100" rx="10" fill="#0e1316"/>
    <rect x="20" y="10" width="24" height="5" rx="2.5" fill="#171d22"/>
    <text x="32" y="58" text-anchor="middle" fill="#f3b199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">KIT</text>
    <rect x="22" y="98" width="20" height="3" rx="1.5" fill="#5c6772"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="284" y="312" fill="#f4f0ea" font-size="12" font-weight="700" letter-spacing="1.4">HELM</text>
    <text x="284" y="328" fill="#9aa3ab" font-size="9" letter-spacing="0.6">iPhone + CarPlay</text>
  </g>

  <!-- Mailbox -->
  <g transform="translate(400,168)" filter="url(#soft)">
    <polygon points="100,4 186,52 186,148 100,196 14,148 14,52" fill="#171d22" stroke="#f07848" stroke-width="2"/>
    <polygon points="100,22 168,60 168,136 100,174 36,136 36,60" fill="#0e1316"/>
    <g fill="#3db8a0">
      <circle cx="82" cy="98" r="3.5"/>
      <circle cx="100" cy="98" r="3.5" opacity="0.55"/>
      <circle cx="118" cy="98" r="3.5" opacity="0.35"/>
    </g>
    <text x="100" y="124" text-anchor="middle" fill="#f3b199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">MAILBOX</text>
    <text x="100" y="142" text-anchor="middle" fill="#84909a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.6">one Durable Object</text>
  </g>

  <!-- Crane -->
  <g transform="translate(690,158)" filter="url(#soft)">
    <use xlink:href="#mini-gantry" href="#mini-gantry" x="0" y="8" width="220" height="121"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="800" y="300" fill="#f4f0ea" font-size="15" font-weight="700" letter-spacing="1.6">THE CRANE</text>
    <text x="800" y="318" fill="#9aa3ab" font-size="10" letter-spacing="0.8">ai-gantry &#183; outbound only</text>
  </g>

  <!-- Vendor mouth, model, optional tools -->
  <g transform="translate(1024,168)" filter="url(#soft)">
    <rect x="0" y="0" width="196" height="64" rx="6" fill="#171d22" stroke="#3db8a0" stroke-width="1.5"/>
    <text x="98" y="28" text-anchor="middle" fill="#f4f0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.1">TELEGRAM</text>
    <text x="98" y="46" text-anchor="middle" fill="#9aa3ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="0.6">Discord / Slack too</text>
  </g>
  <g transform="translate(1024,248)" filter="url(#soft)">
    <rect x="0" y="0" width="196" height="52" rx="6" fill="#171d22" stroke="#5c6772" stroke-width="1.2"/>
    <text x="98" y="22" text-anchor="middle" fill="#f3b199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">LLM SOCKET</text>
    <text x="98" y="38" text-anchor="middle" fill="#84909a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">OpenAI-compat</text>
  </g>
  <g transform="translate(1024,316)">
    <rect x="0" y="0" width="196" height="40" rx="6" fill="#171d22" stroke="#5c6772" stroke-dasharray="4 3" stroke-width="1.2"/>
    <text x="98" y="25" text-anchor="middle" fill="#9aa3ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.8">MCP &#183; optional</text>
  </g>

  <!-- Mouths share one dashed dial into the top of the mailbox -->
  <path d="M76 196 V150 H180 V176" fill="none" stroke="#f07848" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.9"/>
  <path d="M180 150 H284 V176" fill="none" stroke="#f07848" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.9"/>
  <path d="M284 150 H500 V168" fill="none" stroke="#f07848" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.9" marker-end="url(#arr-accent)"/>
  <text x="392" y="134" text-anchor="middle" fill="#84909a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">wss in</text>

  <!-- Crane dials the mailbox -->
  <path d="M690 248 C660 230 640 228 590 250" fill="none" stroke="#3db8a0" stroke-width="1.7" opacity="0.95" marker-end="url(#arr-ok)"/>
  <text x="600" y="214" fill="#3db8a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.8">outbound wss</text>

  <!-- Crane dials Telegram, the model, and optional MCP -->
  <path d="M910 210 C960 200 990 196 1022 196" fill="none" stroke="#3db8a0" stroke-width="1.7" opacity="0.95" marker-end="url(#arr-ok)"/>
  <text x="940" y="186" fill="#3db8a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="0.8">outbound</text>
  <path d="M910 268 C960 274 990 276 1022 274" fill="none" stroke="#5c6772" stroke-width="1.4" marker-end="url(#arr-accent)"/>
  <path d="M860 300 C930 330 980 334 1022 334" fill="none" stroke="#5c6772" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.85" marker-end="url(#arr-accent)"/>

  <rect x="160" y="408" width="960" height="28" rx="4" fill="#0e1316"/>
  <text x="640" y="426" text-anchor="middle" fill="#9aa3ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">zero inbound ports on the crane &#183; one room &#183; vendor mouths skip the mailbox</text>
</svg>
