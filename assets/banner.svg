<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Shipping yard for personal agents - operator plane, not the chat">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="55%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2330"/>
      <stop offset="100%" stop-color="#0c1218"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="40%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="42%" r="34%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Mini copy of the ai-gantry machine: two posts, beam, hanging model. -->
    <symbol id="mini-gantry" viewBox="0 0 160 88">
      <rect x="8" y="78" width="144" height="10" rx="2" fill="url(#bed)" stroke="#44403c" stroke-width="1"/>
      <rect x="18" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="135" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="12" y="10" width="136" height="12" rx="2" fill="url(#beam)"/>
      <rect x="18" y="13" width="124" height="3" rx="1" fill="#fafaf9" opacity="0.5"/>
      <rect x="66" y="8" width="28" height="16" rx="2" fill="#d6d3d1"/>
      <rect x="74" y="24" width="12" height="14" rx="1" fill="#a8a29e"/>
      <rect x="64" y="40" width="32" height="18" rx="3" fill="url(#chip)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="80" y="53" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.6">MODEL</text>
    </symbol>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="640" cy="190" rx="320" ry="140" fill="url(#glow)"/>

  <!-- Category stamp; repo name stays in the README heading -->
  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="38" fill="#f59e0b" font-size="16" font-weight="700" letter-spacing="6">THE SHIPPING YARD</text>
    <text x="640" y="58" fill="#a8a29e" font-size="12" letter-spacing="3.2">ONE CONSOLE, MANY CRANES</text>
  </g>

  <!-- Water + quay -->
  <rect x="0" y="368" width="1280" height="52" fill="url(#water)"/>
  <g stroke="#34d399" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <path d="M0 382 q80 8 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0"/>
    <path d="M0 396 q80 -6 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0"/>
  </g>
  <rect x="80" y="328" width="1120" height="44" rx="4" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
  <g stroke="#57534e" stroke-width="1.5" opacity="0.7">
    <line x1="140" y1="340" x2="1160" y2="340"/>
    <line x1="140" y1="356" x2="1160" y2="356"/>
  </g>

  <!-- Yard rail: the console rides this. The agents are the little gantries below. -->
  <g filter="url(#soft)">
    <rect x="168" y="96" width="22" height="236" rx="3" fill="url(#post)"/>
    <rect x="1090" y="96" width="22" height="236" rx="3" fill="url(#post)"/>
    <rect x="148" y="84" width="984" height="28" rx="4" fill="url(#beam)"/>
    <rect x="168" y="92" width="944" height="6" rx="2" fill="#fafaf9" opacity="0.45"/>
  </g>

  <!-- Operator cab on the rail - watching, not in the token path -->
  <g transform="translate(214,68)" filter="url(#soft)">
    <rect x="0" y="0" width="118" height="52" rx="5" fill="#27272a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="10" y="10" width="98" height="24" rx="2" fill="#0c0d10"/>
    <g fill="#34d399">
      <circle cx="22" cy="22" r="2.5"/>
      <circle cx="34" cy="22" r="2.5" opacity="0.5"/>
      <circle cx="46" cy="22" r="2.5" opacity="0.35"/>
    </g>
    <text x="59" y="46" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.4">CONSOLE</text>
  </g>
  <g stroke="#f59e0b" stroke-dasharray="4 4" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M332 120 C390 150 430 170 500 210"/>
    <path d="M332 120 C500 140 600 145 700 150"/>
    <path d="M332 120 C560 140 820 170 880 210"/>
  </g>
  <text x="390" y="158" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.5">pull, don't punch</text>

  <!-- Yard crane picks up a whole agent, not a crate. -->
  <g transform="translate(640,108)">
    <rect x="0" y="0" width="72" height="18" rx="2" fill="#d6d3d1"/>
    <rect x="8" y="4" width="56" height="6" rx="1" fill="#78716c"/>
    <line x1="18" y1="18" x2="18" y2="42" stroke="#a8a29e" stroke-width="2.5"/>
    <line x1="54" y1="18" x2="54" y2="42" stroke="#a8a29e" stroke-width="2.5"/>
    <path d="M12 42 L18 50 L24 42" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M48 42 L54 50 L60 42" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- ROBERT in the hook. Empty berth on the quay below. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(596,148)" filter="url(#soft)">
      <use xlink:href="#mini-gantry" href="#mini-gantry" x="4" y="0" width="160" height="88"/>
      <circle cx="18" cy="108" r="4" fill="#34d399"/>
      <text x="28" y="111" fill="#a8a29e" font-size="8" letter-spacing="0.4">ai-gantry</text>
      <text x="84" y="128" text-anchor="middle" fill="#e7e5e4" font-size="14" font-weight="700" letter-spacing="1">ROBERT</text>
    </g>
    <rect x="620" y="300" width="152" height="22" rx="3" fill="none" stroke="#57534e" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="696" y="315" text-anchor="middle" fill="#57534e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1">berth</text>

    <g transform="translate(400,198)" filter="url(#soft)">
      <use xlink:href="#mini-gantry" href="#mini-gantry" x="4" y="0" width="160" height="88"/>
      <circle cx="18" cy="108" r="4" fill="#34d399"/>
      <text x="28" y="111" fill="#a8a29e" font-size="8" letter-spacing="0.4">ai-gantry</text>
      <text x="84" y="128" text-anchor="middle" fill="#e7e5e4" font-size="14" font-weight="700" letter-spacing="1">ROBERTA</text>
    </g>
    <g transform="translate(814,198)" filter="url(#soft)">
      <g opacity="0.72">
        <use xlink:href="#mini-gantry" href="#mini-gantry" x="4" y="0" width="160" height="88"/>
      </g>
      <circle cx="18" cy="108" r="4" fill="#71717a"/>
      <text x="28" y="111" fill="#78716c" font-size="8" letter-spacing="0.4">ai-gantry</text>
      <text x="84" y="128" text-anchor="middle" fill="#e7e5e4" font-size="14" font-weight="700" letter-spacing="1">RO-BOB</text>
    </g>
  </g>

  <!-- Outbound only: agents dial out, nothing listens -->
  <g fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M990 250 c28 -16 50 -16 78 0"/>
    <path d="M1002 264 c22 -11 40 -11 64 0"/>
    <path d="M1014 278 c16 -8 28 -8 44 0"/>
  </g>
  <polygon points="1070,246 1086,250 1070,262" fill="#34d399" opacity="0.85"/>
  <text x="1096" y="268" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2">outbound</text>
  <text x="1096" y="284" fill="#57534e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">zero inbound ports</text>
</svg>
