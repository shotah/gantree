# Compose sidecar. Gantree is unpublished; this is what you port-forward.
# Drops scanner junk. Login is still the door. A flood can still knock it over.

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;

    # Docker DNS — gantree can bounce without a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~* \.(php|aspx|jsp|cgi)$ { return 444; }
    location ~* ^/(wp-|xmlrpc|phpmyadmin|cgi-bin) { return 444; }
    location ~ /\. { return 444; }

    location / {
        limit_except GET HEAD POST PUT OPTIONS { deny all; }

        set $backend http://gantree:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
